[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genespt"
version = "1.0.0"
description = "Gene-conditioned decoding and predictable spatial program transfer for held-out gene expression prediction"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Zitao Le" }]
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "scikit-learn",
  "torch",
  "pyyaml",
  "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]

