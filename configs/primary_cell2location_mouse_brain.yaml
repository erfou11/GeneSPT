# Primary benchmark: Cell2location mouse brain.
# This file describes the full benchmark model with validation-selected fusion.
# It is not the matched identity-readout PSP toggle; see
# docs/AUDIT_REPRODUCTION.md for that archived-matrix comparison.
dataset_id: Cell2location_mouse_brain_ST8059048_shared12819
dataset_role: primary
fold: 0
seed: 0

st_matrix: data/processed/Cell2location_mouse_brain_ST8059048_shared12819/st_matrix.npy
scrna_matrix: data/processed/Cell2location_mouse_brain_ST8059048_shared12819/scrna_matrix.npy
spatial_coordinates: data/processed/Cell2location_mouse_brain_ST8059048_shared12819/coordinates.npy
gene_names: data/processed/Cell2location_mouse_brain_ST8059048_shared12819/gene_names.txt
split_dir: splits/Cell2location_mouse_brain_ST8059048_shared12819
train_gene_indices: splits/Cell2location_mouse_brain_ST8059048_shared12819/fold0_train_gene_idx.npy
val_gene_indices: splits/Cell2location_mouse_brain_ST8059048_shared12819/fold0_val_gene_idx.npy
test_gene_indices: splits/Cell2location_mouse_brain_ST8059048_shared12819/fold0_test_gene_idx.npy

out_dir: results/predictions/Cell2location_mouse_brain_ST8059048_shared12819/GeneSPT/fold0

descriptor_method: pca32_nmf32
n_pca: 32
n_nmf: 32

training:
  epochs: 1000
  lr: 0.001
  weight_decay: 0.00001
  spot_hidden_dim: 128
  gene_hidden_dim: 64
  decoder_hidden_dim: 128
  dropout: 0.05
  device: auto
  seed: 0
  progress: true

psp:
  n_components: 16
  ridge_alpha: 10.0
  min_component_corr: 0.0
  top_k:

fusion:
  readout: validation_selected_global_weight
  psp_weight_grid: [0.0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]

evaluator:
  true: data/processed/Cell2location_mouse_brain_ST8059048_shared12819/st_matrix.npy
  pred: results/predictions/Cell2location_mouse_brain_ST8059048_shared12819/GeneSPT/fold0/prediction_test.npy
  test_indices: splits/Cell2location_mouse_brain_ST8059048_shared12819/fold0_test_gene_idx.npy
  out: results/evaluation/Cell2location_mouse_brain_ST8059048_shared12819/GeneSPT/fold0_summary.csv
