# Cross-platform benchmark: seqFISH+ cortex/SVZ.
dataset_id: seqFISH_plus_cortex_svz_zeisel_sccortex_ref_shared10000
dataset_role: cross_platform
fold: 0
seed: 0

st_matrix: data/processed/seqFISH_plus_cortex_svz_zeisel_sccortex_ref_shared10000/st_matrix.npy
scrna_matrix: data/processed/seqFISH_plus_cortex_svz_zeisel_sccortex_ref_shared10000/scrna_matrix.npy
spatial_coordinates: data/processed/seqFISH_plus_cortex_svz_zeisel_sccortex_ref_shared10000/coordinates.npy
gene_names: data/processed/seqFISH_plus_cortex_svz_zeisel_sccortex_ref_shared10000/gene_names.txt
split_dir: splits/seqFISH_plus_cortex_svz_zeisel_sccortex_ref_shared10000
train_gene_indices: splits/seqFISH_plus_cortex_svz_zeisel_sccortex_ref_shared10000/fold0_train_gene_idx.npy
val_gene_indices: splits/seqFISH_plus_cortex_svz_zeisel_sccortex_ref_shared10000/fold0_val_gene_idx.npy
test_gene_indices: splits/seqFISH_plus_cortex_svz_zeisel_sccortex_ref_shared10000/fold0_test_gene_idx.npy

out_dir: results/predictions/seqFISH_plus_cortex_svz_zeisel_sccortex_ref_shared10000/GeneSPT/fold0

descriptor_method: pca32_nmf32
n_pca: 32
n_nmf: 32

training:
  epochs: 1000
  lr: 0.001
  weight_decay: 0.00001
  spot_hidden_dim: 128
  gene_hidden_dim: 64
  decoder_hidden_dim: 128
  dropout: 0.05
  device: auto
  seed: 0
  progress: true

psp:
  n_components: 16
  ridge_alpha: 10.0
  min_component_corr: 0.0
  top_k:

fusion:
  readout: validation_selected_global_weight
  psp_weight_grid: [0.0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]

evaluator:
  true: data/processed/seqFISH_plus_cortex_svz_zeisel_sccortex_ref_shared10000/st_matrix.npy
  pred: results/predictions/seqFISH_plus_cortex_svz_zeisel_sccortex_ref_shared10000/GeneSPT/fold0/prediction_test.npy
  test_indices: splits/seqFISH_plus_cortex_svz_zeisel_sccortex_ref_shared10000/fold0_test_gene_idx.npy
  out: results/evaluation/seqFISH_plus_cortex_svz_zeisel_sccortex_ref_shared10000/GeneSPT/fold0_summary.csv
