# Cross-platform benchmark: MHPR/MERFISH.
dataset_id: MHPR_current_panel
dataset_role: cross_platform
fold: 0
seed: 0

st_matrix: data/processed/MHPR_current_panel/st_matrix.npy
scrna_matrix: data/processed/MHPR_current_panel/scrna_matrix.npy
spatial_coordinates: data/processed/MHPR_current_panel/coordinates.npy
gene_names: data/processed/MHPR_current_panel/gene_names.txt
split_dir: splits/MHPR_current_panel
train_gene_indices: splits/MHPR_current_panel/fold0_train_gene_idx.npy
val_gene_indices: splits/MHPR_current_panel/fold0_val_gene_idx.npy
test_gene_indices: splits/MHPR_current_panel/fold0_test_gene_idx.npy

out_dir: results/predictions/MHPR_current_panel/GeneSPT/fold0

descriptor_method: pca32_nmf32
n_pca: 32
n_nmf: 32
configuration_status: logical_path_manifest_only
verified_parameter_source: configs/canonical_gc_psp.yaml

evaluator:
  true: data/processed/MHPR_current_panel/st_matrix.npy
  pred: results/predictions/MHPR_current_panel/GeneSPT/fold0/prediction_test.npy
  test_indices: splits/MHPR_current_panel/fold0_test_gene_idx.npy
  out: results/evaluation/MHPR_current_panel/GeneSPT/fold0_summary.csv
